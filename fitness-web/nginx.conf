# One SPA build serves both hosts; the app switches to the admin panel on "admin.*".
map $host $robots_tag {
  ~^admin\.  "noindex, nofollow";
  default    "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Robots-Tag $robots_tag always;

  location /api/ {
    proxy_pass http://fitness-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The 3D body model is ~3.4 MB; meshopt data still gzips by ~30%.
  location /models/ {
    gzip on;
    gzip_types application/octet-stream model/gltf-binary;
    expires 7d;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
